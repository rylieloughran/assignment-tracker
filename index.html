<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Assignment Tracker</title>
        <!-- Tailwind CSS CDN for styling support -->
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="./styles.css" rel="stylesheet">
    </head>
    <body class="bg-sky-50 text-slate-700 font-mono min-h-screen p-4 md:p-8">
        <div class="max-w-2xl mx-auto space-y-6">
        <header class="bg-sky-100/70 border border-sky-200 rounded-xl p-5 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <h1 class="text-2xl font-bold text-sky-900 tracking-wide"> Assignment Tracker </h1>
            <div id="procrastination-banner" class="bg-sky-200/50 border border-sky-300/60 rounded-lg px-3 py-2 text-xs">
                <label for="procrastination-toggle" class="flex items-center gap-2 cursor-pointer select-none text-sky-900">
                    <input type="checkbox" id="procrastination-toggle" class="rounded accent-sky-500 cursor-pointer">
                    <strong>Counter-Procrastination Mode</strong>
                </label>
            </div>
        </header>

        <!-- Optional Banner Message for Counter-Procrastination Toggle -->
        <div id="procrastination-message" class="hidden bg-amber-100 border border-amber-300 text-amber-900 text-xs rounded-xl p-3 shadow-sm">
            ⚡ <strong>Procrastination Defense Active:</strong> Focus on your most critical assignments first!
        </div>

        <main class="space-y-6">
            <section class="bg-white/80 backdrop-blur border border-sky-200/80 rounded-xl p-6 shadow-sm space-y-4">
                <h2 class="text-sm font-bold text-sky-800 uppercase tracking-wider border-b border-sky-100 pb-2">Add New Assignment</h2>
                <form id="assignment-form" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="assignment-title" class="block text-xs font-semibold text-sky-700 mb-1">Assignment Title</label>
                        <input type="text" id="assignment-title" name="assignment-title" placeholder="e.g., Research Paper" required class="w-full bg-sky-50/50 border border-sky-200 rounded-lg px-3 py-2 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-300">
                    </div>

                    <div>
                        <label for="course-name" class="block text-xs font-semibold text-sky-700 mb-1"> Course / Name</label>
                        <input type="text" id="course-name" name="course-name" placeholder="e.g., CS 001" required class="w-full bg-sky-50/50 border border-sky-200 rounded-lg px-3 py-2 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-300">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label for="due-date" class="block text-xs font-semibold text-sky-700 mb-1">Due Date</label>
                        <input type="date" id="due-date" name="due-date" required class="w-full bg-sky-50/50 border border-sky-200 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-300">
                    </div>

                    <div>
                        <label for="assignment-urgency" class="block text-xs font-semibold text-sky-700 mb-1">Assignment Urgency</label>
                        <select id="assignment-urgency" name="assignment-urgency" class="w-full bg-sky-50/50 border border-sky-200 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-300">
                            <option value="1">Critical</option>
                            <option value="2">High</option>
                            <option value="3">Medium</option>
                            <option value="4">Low</option>
                        </select>
                    </div>

                    <div>
                        <label for="estimated-time" class="block text-xs font-semibold text-sky-700 mb-1">Estimated Time (minutes)</label>
                        <input type="number" id="estimated-time" name="estimated-time" min="5" step="5" placeholder="e.g., 30" class="w-full bg-sky-50/50 border border-sky-200 rounded-lg px-3 py-2 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-300">
                    </div>
                </div>
                    <button type="submit" class="inline-flex items-center gap-2 bg-sky-100/70 border border-sky-300/70 text-slate-800 font-semibold px-4 py-2 rounded-lg text-xs hover:bg-sky-200/80 transition cursor-pointer">Create Assignment</button>
                </form>
            </section>

            <section class="bg-sky-100/50 border border-sky-200/60 rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <h2 class="text-xs font-bold text-sky-800 uppercase tracking-wider">Filter and Sort</h2>
                <div>
                    <label for="sort-by" class="text-xs font-semibold text-sky-800">Sort Assignments By:</label>
                    <select id="sort-by" class="bg-white border border-sky-200 rounded-lg px-3 py-1.5 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-300 cursor-pointer">
                        <option value="due-date-asc">Due Date (Soonest First)</option>
                        <option value="assignment-urgency-asc">Urgency (Highest First)</option>
                        <option value="estimated-time-asc">Estimated Time (Shortest First)</option>
                        <option value="estimated-time-desc">Estimated Time (Longest First)</option>
                    </select>
                </div>
            </section>

            <section class="space-y-3">
                <h2 class="text-xs font-bold text-sky-800 uppercase tracking-wider px-1">Your Assignments</h2>
                <div id="assignments-container" class="space-y-3">
                    
                </div>
            </section>
        </main>
        </div>
        <script src="app.js"></script>
    </body>
</html>
