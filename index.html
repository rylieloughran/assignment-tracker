<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset = "UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Assignment Tracker</title>
    </head>
    <body>
        <header>
            <h1> Assignment Tracker </h1>
            <div id="procrastination-banner">
                <label for="procrastination-toggle">
                    <input type="checkbox" id="procrastination-toggle">
                    <strong>Counter-Procrastination Mode</strong>
                </label>
            </div>
            <link href="./styles.css" rel="stylesheet">
        </header>

        <main>
            <section>
                <h2>Add New Assignment</h2>
                <form id="assignment-form">
                    <div>
                        <label for="assignment-title">Assignment Title</label>
                        <input type="text" id="assignment-title" name="assignment-title" placeholder="e.g., Research Paper" required>
                    </div>

                    <div>
                        <label for="course-name"> Course / Name</label>
                        <input type="text" id="course-name" name="course-name" placeholder="e.g., CS 001" required>
                    </div>

                    <div>
                        <label for="due-date">Due Date</label>
                        <input type="date" id="due-date" name="due-date" required>
                    </div>

                    <div>
                        <label for="assignment-urgency">Assignment Urgency</label>
                        <select id="assignment-urgency" name="assignment-urgency">
                            <option value="1">Critical</option>
                            <option value="2">High</option>
                            <option value="3">Medium</option>
                            <option value="4">Low</option>
                        </select>
                    </div>

                    <div>
                        <label for="estimated-time">Estimated Time (minutes)</label>
                        <input type="number" id="estimated-time" name="estimated-time" min="5" step="5" placeholder="e.g., 30">
                    </div>

                    <button type="submit">Create Assignment</button>
                </form>
            </section>

            <section>
                <h2>Filter and Sort</h2>
                <div>
                    <label for="sort-by">Sort Assignments By:</label>
                    <select id="sort-by">
                        <option value="due-date-asc">Due Date (Soonest First)</option>
                        <option value="assignment-urgency-asc">Urgency (Highest First)</option>
                        <option value="estimated-time-asc">Estimated Time (Shortest First)</option>
                        <option value="estimated-time-desc">Estiamted Time (Longest First)</option>
                    </select>
                </div>
            </section>

            <section>
                <h2>Your Assignments</h2>
                <div id="assignments-container">
                    
                </div>
            </section>
        </main>
        <script src="app.js"></script>
    </body>
</html>
